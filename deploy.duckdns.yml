services:
  postgres:
    environment:
      POSTGRES_DB: mangahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mangahub-change-me}
      POSTGRES_USER: mangahub
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mangahub-api:
    build:
      context: https://github.com/GRPeres/MangaHUB.git#main
      dockerfile: src/MangaHub.Api/Dockerfile
    depends_on:
      - postgres
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:-mangahub-change-me}
      FrontendOrigin: ${FRONTEND_ORIGIN:-http://mangahub.duckdns.org:8080}
      MangaHub__JwtSecret: ${JWT_SECRET:-replace-with-a-long-random-secret}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexEnabled: ${MANGADEX_ENABLED:-true}
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:-}
      MangaHub__SessionCookieSameSite: ${SESSION_COOKIE_SAMESITE:-Lax}
      MangaHub__SessionCookieSecure: ${SESSION_COOKIE_SECURE:-false}
    expose:
      - '8080'
    image: mangahub-api:latest
    restart: unless-stopped
    volumes:
      - ${HOST_LIBRARY_PATH:-/mnt/storage/manga}:/library:ro

  mangahub-workers:
    build:
      context: https://github.com/GRPeres/MangaHUB.git#main
      dockerfile: src/MangaHub.Workers/Dockerfile
    depends_on:
      - postgres
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:-mangahub-change-me}
      MangaHub__JwtSecret: ${JWT_SECRET:-replace-with-a-long-random-secret}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexEnabled: ${MANGADEX_ENABLED:-true}
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:-}
    image: mangahub-workers:latest
    restart: unless-stopped
    volumes:
      - ${HOST_LIBRARY_PATH:-/mnt/storage/manga}:/library:ro

  mangahub-web:
    build:
      context: https://github.com/GRPeres/MangaHUB.git#main
      dockerfile: src/MangaHub.Web/Dockerfile
    depends_on:
      - mangahub-api
    image: mangahub-web:latest
    ports:
      - '${WEB_HOST_PORT:-8080}:80'
    restart: unless-stopped

  duckdns:
    environment:
      LOG_FILE: 'false'
      SUBDOMAINS: ${DUCKDNS_SUBDOMAINS:-mangahub}
      TOKEN: ${DUCKDNS_TOKEN:-replace-with-your-duckdns-token}
      TZ: ${TZ:-America/Sao_Paulo}
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped

volumes:
  postgres-data:
