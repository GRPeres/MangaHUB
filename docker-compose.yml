services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangahub
      POSTGRES_USER: mangahub
      POSTGRES_PASSWORD: mangahub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangahub -d mangahub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/MangaHub.Api/Dockerfile
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=mangahub
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexCachePath: /mangadex-cache
      MangaHub__JwtSecret: ${JWT_SECRET:-change-me-before-deploying-to-a-long-random-secret}
      MangaHub__InternalWorkerToken: ${INTERNAL_WORKER_TOKEN:-local-worker-token-change-me}
      MangaHub__MangaDexEnabled: ${MANGADEX_ENABLED:-true}
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:-}
      MangaHub__SessionCookieSameSite: Lax
      MangaHub__SessionCookieSecure: false
      FrontendOrigin: http://localhost:3000
    volumes:
      - ${HOST_LIBRARY_PATH:-./library}:/library:ro
      - mangadex-cache:/mangadex-cache
    ports:
      - "8000:8080"
    networks:
      default:
        aliases:
          - mangahub-api
    depends_on:
      postgres:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: src/MangaHub.Workers/Dockerfile
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=mangahub
      MangaHub__InternalApiUrl: http://mangahub-api:8080
      MangaHub__InternalWorkerToken: ${INTERNAL_WORKER_TOKEN:-local-worker-token-change-me}
      MangaHub__MangaDexMaintenanceHour: 4
      MangaHub__MangaDexMaintenanceTimeZone: America/Sao_Paulo
      MangaHub__MangaDexPrefetchBatchSize: 6
      MangaHub__MangaDexPrefetchMaxChaptersPerManga: 3
      MangaHub__MangaDexIdleBackfillEnabled: true
      MangaHub__MangaDexIdleMinutes: 30
      MangaHub__MangaDexIdleBackfillCheckMinutes: 60
      MangaHub__MangaDexIdleBackfillBatchSize: 1
      MangaHub__MangaDexIdleBackfillMaxChaptersPerManga: 2
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/MangaHub.Web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-data:
  mangadex-cache:
