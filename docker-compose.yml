services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangahub
      POSTGRES_USER: mangahub
      POSTGRES_PASSWORD: mangahub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangahub -d mangahub"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/MangaHub.Api/Dockerfile
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=mangahub
      MangaHub__LibraryPath: /library
      MangaHub__JwtSecret: ${JWT_SECRET:-change-me-before-deploying-to-a-long-random-secret}
      MangaHub__MangaDexEnabled: ${MANGADEX_ENABLED:-true}
      MangaHub__SessionCookieSameSite: Lax
      MangaHub__SessionCookieSecure: false
      FrontendOrigin: http://localhost:3000
    volumes:
      - ${HOST_LIBRARY_PATH:-./library}:/library:ro
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: src/MangaHub.Workers/Dockerfile
    environment:
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=mangahub
      MangaHub__LibraryPath: /library
      MangaHub__JwtSecret: ${JWT_SECRET:-change-me-before-deploying-to-a-long-random-secret}
      MangaHub__MangaDexEnabled: ${MANGADEX_ENABLED:-true}
    volumes:
      - ${HOST_LIBRARY_PATH:-./library}:/library:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/MangaHub.Web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-data:
