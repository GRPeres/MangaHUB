# Paste this into the existing MangaHub Custom App YAML in TrueNAS.
# Replace every value marked CHANGE-ME. Do not create a second MangaHub app.
#
# After the first GitHub Actions run, set each ghcr.io/grperes/mangahub-* package
# to Public in GitHub Packages, or log the TrueNAS Docker host into GHCR with a
# read:packages token before deploying this file.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set_CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mangahub-web
    restart: unless-stopped

  mangahub-api:
    image: ghcr.io/grperes/mangahub-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
      FrontendOrigin: https://mangahub.app
      MangaHub__JwtSecret: ${JWT_SECRET:?Set_JWT_SECRET}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexCachePath: /mangadex-cache
      MangaHub__MangaDexEnabled: "true"
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:?Set_MYANIMELIST_CLIENT_ID}
      MangaHub__SessionCookieSameSite: Lax
      MangaHub__SessionCookieSecure: "true"
      MangaHub__Email__SmtpHost: smtp.gmail.com
      MangaHub__Email__SmtpPort: "587"
      MangaHub__Email__UseSsl: "true"
      MangaHub__Email__SmtpUsername: ${SMTP_USERNAME:?Set_SMTP_USERNAME}
      MangaHub__Email__SmtpPassword: ${SMTP_PASSWORD:?Set_SMTP_PASSWORD}
      MangaHub__Email__FromAddress: ${SMTP_FROM_ADDRESS:?Set_SMTP_FROM_ADDRESS}
      MangaHub__Email__FromName: MangaHub
      MangaHub__GoogleAuth__ClientId: ${GOOGLE_AUTH_CLIENT_ID:?Set_GOOGLE_AUTH_CLIENT_ID}
      MangaHub__GoogleAuth__ClientSecret: ${GOOGLE_AUTH_CLIENT_SECRET:?Set_GOOGLE_AUTH_CLIENT_SECRET}
    volumes:
      - /mnt/storage/manga:/library:ro
      - /mnt/Shared/NAS/MangaHUBMangaDexCache:/mangadex-cache
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  mangahub-web:
    image: ghcr.io/grperes/mangahub-web:latest
    depends_on:
      - mangahub-api
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  mangahub-workers:
    image: ghcr.io/grperes/mangahub-workers:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
      MangaHub__JwtSecret: ${JWT_SECRET:?Set_JWT_SECRET}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexCachePath: /mangadex-cache
      MangaHub__MangaDexEnabled: "true"
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:?Set_MYANIMELIST_CLIENT_ID}
      MangaHub__MangaDexMaintenanceHour: "4"
      MangaHub__MangaDexMaintenanceTimeZone: America/Sao_Paulo
      MangaHub__MangaDexPrefetchBatchSize: "6"
      MangaHub__MangaDexPrefetchMaxChaptersPerManga: "3"
      MangaHub__MangaDexIdleBackfillEnabled: "true"
      MangaHub__MangaDexIdleMinutes: "30"
      MangaHub__MangaDexIdleBackfillCheckMinutes: "60"
      MangaHub__MangaDexIdleBackfillBatchSize: "1"
      MangaHub__MangaDexIdleBackfillMaxChaptersPerManga: "2"
    volumes:
      - /mnt/storage/manga:/library:ro
      - /mnt/Shared/NAS/MangaHUBMangaDexCache:/mangadex-cache
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangahub
      POSTGRES_USER: mangahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mangahub -d mangahub]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups

        verify_database="mangahub_backup_verify"

        cleanup_verify_database() {
          psql -h postgres -U mangahub -d postgres -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$$verify_database' AND pid <> pg_backend_pid();" >/dev/null 2>&1 || true
          psql -h postgres -U mangahub -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$$verify_database\";" >/dev/null 2>&1 || true
        }

        verify_dump() {
          dump_file="$$1"
          marker="$$dump_file.verified"
          failure_marker="$$dump_file.failed"
          rm -f "$$marker" "$$failure_marker"
          cleanup_verify_database

          if ! psql -h postgres -U mangahub -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$verify_database\";" >/dev/null; then
            echo "Backup verification failed: could not create $$verify_database" >&2
            touch "$$failure_marker"
            return
          fi

          if ! pg_restore -h postgres -U mangahub -d "$$verify_database" --exit-on-error --no-owner --no-privileges "$$dump_file"; then
            echo "Backup verification failed: restore failed for $$dump_file" >&2
            touch "$$failure_marker"
            cleanup_verify_database
            return
          fi

          # PostgreSQL 16 adds a random \restrict token to plain dump output. It is not schema,
          # so remove it before comparing the two otherwise-identical schemas.
          pg_dump -h postgres -U mangahub -d mangahub --schema-only --no-owner --no-privileges | sed '/^\\restrict /d; /^\\unrestrict /d' > /tmp/live-schema.sql
          pg_dump -h postgres -U mangahub -d "$$verify_database" --schema-only --no-owner --no-privileges | sed '/^\\restrict /d; /^\\unrestrict /d' > /tmp/restored-schema.sql
          if ! cmp -s /tmp/live-schema.sql /tmp/restored-schema.sql; then
            echo "Backup verification warning: restored schema differs from the live database" >&2
            touch "$$failure_marker"
            cleanup_verify_database
            return
          fi

          table_mismatch=0
          tables="$$(psql -h postgres -U mangahub -d mangahub -At -v ON_ERROR_STOP=1 -c \"SELECT quote_ident(schemaname) || '.' || quote_ident(tablename) FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;\")"
          for table in $$tables; do
            live_count="$$(psql -h postgres -U mangahub -d mangahub -At -v ON_ERROR_STOP=1 -c \"SELECT count(*) FROM $$table;\")"
            restored_count="$$(psql -h postgres -U mangahub -d \"$$verify_database\" -At -v ON_ERROR_STOP=1 -c \"SELECT count(*) FROM $$table;\")"
            if [ "$$live_count" != "$$restored_count" ]; then
              echo "Backup verification warning: $$table has $$live_count live rows and $$restored_count restored rows" >&2
              table_mismatch=1
            fi
          done

          cleanup_verify_database
          if [ "$$table_mismatch" -eq 0 ]; then
            printf 'verified_at=%s\ndump=%s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$(basename "$$dump_file")" > "$$marker"
            echo "Backup verification passed: $$dump_file"
          else
            touch "$$failure_marker"
          fi
        }

        prune_backups() {
          (ls -1t /backups/mangahub-*.dump 2>/dev/null || true) | awk 'NR > 7' | while IFS= read -r expired; do
            rm -f "$$expired" "$$expired.verified" "$$expired.failed"
          done
        }

        while true; do
          file="/backups/mangahub-$$(date +%Y%m%d-%H%M%S).dump"
          temporary_file="$$file.partial"
          rm -f "$$temporary_file"
          pg_dump -h postgres -U mangahub -d mangahub -Fc -f "$$temporary_file"
          mv "$$temporary_file" "$$file"
          verify_dump "$$file"
          prune_backups
          sleep 86400
        done
    volumes:
      - /mnt/Shared/NAS/MangaHUBBackups:/backups
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    command:
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --interval
      - "21600"
      - --stop-timeout
      - 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres-data:
