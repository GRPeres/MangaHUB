# Paste this into the existing MangaHub Custom App YAML in TrueNAS.
# Replace every value marked CHANGE-ME. Do not create a second MangaHub app.
#
# After the first GitHub Actions run, set each ghcr.io/grperes/mangahub-* package
# to Public in GitHub Packages, or log the TrueNAS Docker host into GHCR with a
# read:packages token before deploying this file.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set_CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mangahub-web
    restart: unless-stopped

  mangahub-api:
    image: ghcr.io/grperes/mangahub-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
      FrontendOrigin: https://mangahub.app
      MangaHub__JwtSecret: ${JWT_SECRET:?Set_JWT_SECRET}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexCachePath: /mangadex-cache
      MangaHub__MangaDexEnabled: "true"
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:?Set_MYANIMELIST_CLIENT_ID}
      MangaHub__SessionCookieSameSite: Lax
      MangaHub__SessionCookieSecure: "true"
      MangaHub__Email__SmtpHost: smtp.gmail.com
      MangaHub__Email__SmtpPort: "587"
      MangaHub__Email__UseSsl: "true"
      MangaHub__Email__SmtpUsername: ${SMTP_USERNAME:?Set_SMTP_USERNAME}
      MangaHub__Email__SmtpPassword: ${SMTP_PASSWORD:?Set_SMTP_PASSWORD}
      MangaHub__Email__FromAddress: ${SMTP_FROM_ADDRESS:?Set_SMTP_FROM_ADDRESS}
      MangaHub__Email__FromName: MangaHub
      MangaHub__GoogleAuth__ClientId: ${GOOGLE_AUTH_CLIENT_ID:?Set_GOOGLE_AUTH_CLIENT_ID}
      MangaHub__GoogleAuth__ClientSecret: ${GOOGLE_AUTH_CLIENT_SECRET:?Set_GOOGLE_AUTH_CLIENT_SECRET}
    volumes:
      - /mnt/storage/manga:/library:ro
      - /mnt/Shared/NAS/MangaHUBMangaDexCache:/mangadex-cache
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  mangahub-web:
    image: ghcr.io/grperes/mangahub-web:latest
    depends_on:
      - mangahub-api
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  mangahub-workers:
    image: ghcr.io/grperes/mangahub-workers:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__MangaHub: Host=postgres;Database=mangahub;Username=mangahub;Password=${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
      MangaHub__JwtSecret: ${JWT_SECRET:?Set_JWT_SECRET}
      MangaHub__LibraryPath: /library
      MangaHub__MangaDexCachePath: /mangadex-cache
      MangaHub__MangaDexEnabled: "true"
      MangaHub__MyAnimeListClientId: ${MYANIMELIST_CLIENT_ID:?Set_MYANIMELIST_CLIENT_ID}
      MangaHub__MangaDexMaintenanceHour: "4"
      MangaHub__MangaDexMaintenanceTimeZone: America/Sao_Paulo
      MangaHub__MangaDexPrefetchBatchSize: "6"
      MangaHub__MangaDexPrefetchMaxChaptersPerManga: "3"
      MangaHub__MangaDexIdleBackfillEnabled: "true"
      MangaHub__MangaDexIdleMinutes: "30"
      MangaHub__MangaDexIdleBackfillCheckMinutes: "60"
      MangaHub__MangaDexIdleBackfillBatchSize: "1"
      MangaHub__MangaDexIdleBackfillMaxChaptersPerManga: "2"
    volumes:
      - /mnt/storage/manga:/library:ro
      - /mnt/Shared/NAS/MangaHUBMangaDexCache:/mangadex-cache
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangahub
      POSTGRES_USER: mangahub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mangahub -d mangahub]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        set -u
        mkdir -p /backups
        verify_database="mangahub_backup_verify"
        cleanup_verification_database() {
          psql -h postgres -U mangahub -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$$verify_database' AND pid <> pg_backend_pid();" >/dev/null 2>&1 || true
          psql -h postgres -U mangahub -d postgres -c "DROP DATABASE IF EXISTS \"$$verify_database\";" >/dev/null 2>&1 || true
        }

        while true; do
          timestamp=$$(date +%Y%m%d-%H%M%S)
          file="/backups/mangahub-$$timestamp.dump"
          temporary_file="$$file.partial"
          marker="$$file.verified"
          inconclusive_marker="$$file.inconclusive"
          failure_marker="$$file.failed"
          verification_log="$$file.verification.log"
          rm -f "$$temporary_file"
          if ! pg_dump -h postgres -U mangahub -d mangahub -Fc -f "$$temporary_file"; then
            echo "Backup creation failed; retrying in five minutes." >&2
            rm -f "$$temporary_file"
            sleep 300
            continue
          fi
          mv "$$temporary_file" "$$file"

          rm -f "$$marker" "$$inconclusive_marker" "$$failure_marker"
          : > "$$verification_log"
          max_verify_attempts=3
          attempt=1
          restore_attempts=0
          restore_failures=0
          verification_state=inconclusive

          while [ "$$attempt" -le "$$max_verify_attempts" ]; do
            cleanup_verification_database
            if psql -h postgres -U mangahub -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$$verify_database\";" >> "$$verification_log" 2>&1; then
              restore_attempts=$$((restore_attempts + 1))
              if pg_restore -h postgres -U mangahub -d "$$verify_database" --exit-on-error --no-owner --no-privileges "$$file" >> "$$verification_log" 2>&1; then
                verification_state=verified
                break
              fi

              restore_failures=$$((restore_failures + 1))
              echo "Backup verification restore attempt $$attempt of $$max_verify_attempts failed for $$file." >&2
            else
              echo "Backup verification environment was unavailable on attempt $$attempt of $$max_verify_attempts for $$file." >&2
            fi

            cleanup_verification_database
            attempt=$$((attempt + 1))
            [ "$$attempt" -le "$$max_verify_attempts" ] && sleep 10
          done

          cleanup_verification_database
          if [ "$$verification_state" = verified ]; then
            printf 'verified_at=%s\ndump=%s\nvalidation=full pg_restore into disposable database\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$file" > "$$marker"
            rm -f "$$verification_log"
            echo "Backup verification passed: $$file"
          elif [ "$$restore_attempts" -eq "$$max_verify_attempts" ] && [ "$$restore_failures" -eq "$$max_verify_attempts" ]; then
            printf 'checked_at=%s\ndump=%s\nreason=pg_restore failed in every verification attempt\nlog=%s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$file" "$$verification_log" > "$$failure_marker"
            echo "Backup verification failed: $$file could not be restored after $$max_verify_attempts attempts." >&2
          else
            printf 'checked_at=%s\ndump=%s\nreason=verification environment was unavailable or interrupted; dump was not classified invalid\nlog=%s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$file" "$$verification_log" > "$$inconclusive_marker"
            echo "Backup verification inconclusive: $$file will be retried with the next scheduled backup." >&2
          fi

          ls -1t /backups/mangahub-*.dump 2>/dev/null > /tmp/backup-dumps || true
          keep=0
          while IFS= read -r existing; do
            keep=$$((keep + 1))
            [ "$$keep" -le 7 ] && continue
            rm -f "$$existing" "$$existing.verified" "$$existing.inconclusive" "$$existing.failed" "$$existing.verification.log"
          done < /tmp/backup-dumps
          sleep 86400
        done
    volumes:
      - /mnt/Shared/NAS/MangaHUBBackups:/backups
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    command:
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --interval
      - "21600"
      - --stop-timeout
      - 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres-data:
