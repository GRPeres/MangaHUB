name: Publish MangaHub containers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-containers.yml"
      - "src/**"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: publish-mangahub-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/grperes

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/MangaHub.Api/Dockerfile
          - name: web
            dockerfile: src/MangaHub.Web/Dockerfile
          - name: workers
            dockerfile: src/MangaHub.Workers/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mangahub-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/mangahub-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/GRPeres/MangaHUB
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-production-update:
    name: Trigger production update
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Watchtower after all images publish
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_UPDATE_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.WATCHTOWER_CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.WATCHTOWER_CF_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          names = ('WATCHTOWER_URL', 'WATCHTOWER_TOKEN', 'CF_ACCESS_CLIENT_ID', 'CF_ACCESS_CLIENT_SECRET')
          if any(not os.environ.get(name) for name in names):
              print('::warning::Watchtower trigger is not configured; periodic polling remains active.')
              sys.exit(0)

          url = os.environ['WATCHTOWER_URL']
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or not parsed.hostname or parsed.path != '/v1/update' or parsed.query or parsed.fragment or parsed.username or parsed.password:
              sys.exit('Watchtower URL must be HTTPS and point to /v1/update without query parameters.')

          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['WATCHTOWER_TOKEN'],
              'CF-Access-Client-Id': os.environ['CF_ACCESS_CLIENT_ID'],
              'CF-Access-Client-Secret': os.environ['CF_ACCESS_CLIENT_SECRET'],
          })
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=900) as response:
                  if response.status != 200:
                      sys.exit(f'Watchtower returned HTTP {response.status}.')
                  print('Watchtower update check completed; inspect Watchtower logs for the update results.')
          except urllib.error.HTTPError as error:
              sys.exit(f'Watchtower update request failed with HTTP {error.code}.')
          except (urllib.error.URLError, TimeoutError, OSError) as error:
              sys.exit(f'Watchtower update request failed: {type(error).__name__}.')
          PY
