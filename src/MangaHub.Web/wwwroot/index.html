<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaHub</title>
    <base href="/" />
    <script>
        window.mangaHubTheme = {
            apply: function (theme) {
                var isDark = theme === "dark" || theme === true;
                document.documentElement.classList.toggle("mh-theme-dark", isDark);
                document.documentElement.classList.toggle("mh-theme-light", !isDark);
            }
        };

        try {
            window.mangaHubTheme.apply(localStorage.getItem("mangahub_theme") || "light");
        } catch {
            window.mangaHubTheme.apply("light");
        }
    </script>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css?v=10" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MangaHub.Web.styles.css?v=10" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
