<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaHub</title>
    <base href="/" />
    <script>
        window.mangaHubTheme = {
            apply: function (theme) {
                var isDark = theme === "dark" || theme === true;
                document.documentElement.classList.toggle("mh-theme-dark", isDark);
                document.documentElement.classList.toggle("mh-theme-light", !isDark);
            }
        };
        window.mangaHubStorage = {
            getBoolean: function (key) {
                try { return localStorage.getItem(key) === "true"; } catch { return false; }
            },
            setBoolean: function (key, value) {
                try { localStorage.setItem(key, value ? "true" : "false"); } catch { }
            }
        };
        window.mangaHubPush = {
            subscribe: async function (publicKey) {
                if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
                    throw new Error("This browser does not support PWA push notifications.");
                }
                var permission = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
                if (permission !== "granted") return null;
                var registration = await navigator.serviceWorker.register("service-worker.js");
                var padding = "=".repeat((4 - publicKey.length % 4) % 4);
                var bytes = Uint8Array.from(atob((publicKey + padding).replace(/-/g, "+").replace(/_/g, "/")), function (character) { return character.charCodeAt(0); });
                var subscription = await registration.pushManager.getSubscription();
                if (!subscription) subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
                var json = subscription.toJSON();
                return {
                    endpoint: json.endpoint,
                    p256dh: json.keys.p256dh,
                    auth: json.keys.auth,
                    deviceLabel: (function () {
                        var platform = navigator.userAgentData?.platform || navigator.platform || "";
                        if (/^win/i.test(platform)) return "Windows";
                        if (/android/i.test(platform)) return "Android";
                        if (/iphone|ipad|ipod/i.test(platform)) return "iPhone or iPad";
                        if (/mac/i.test(platform)) return "macOS";
                        if (/linux/i.test(platform)) return "Linux";
                        return platform || "This device";
                    })()
                };
            },
            showTestNotification: async function () {
                if (!("serviceWorker" in navigator) || !("Notification" in window) || Notification.permission !== "granted") {
                    return false;
                }

                var registration = await navigator.serviceWorker.ready;
                await registration.showNotification("MangaHub local notification test", {
                    body: "This device can display MangaHub notifications.",
                    icon: "/icon-192.png",
                    badge: "/icon-192.png",
                    tag: "mangahub-local-test",
                    data: { url: "/library" }
                });
                return true;
            }
        };
        window.mangaHubProgressiveLoad = {
            observe: function (element, dotNetReference, callback) {
                if (!element || !window.IntersectionObserver) return;
                if (element.__mangaHubProgressiveObserver) element.__mangaHubProgressiveObserver.disconnect();
                var observer = new IntersectionObserver(function (entries) {
                    if (entries.some(function (entry) { return entry.isIntersecting; })) {
                        dotNetReference.invokeMethodAsync(callback);
                    }
                }, { rootMargin: "720px 0px" });
                observer.observe(element);
                element.__mangaHubProgressiveObserver = observer;
            },
            unobserve: function (element) {
                if (element && element.__mangaHubProgressiveObserver) {
                    element.__mangaHubProgressiveObserver.disconnect();
                    delete element.__mangaHubProgressiveObserver;
                }
            }
        };

        try {
            window.mangaHubTheme.apply(localStorage.getItem("mangahub_theme") || "light");
        } catch {
            window.mangaHubTheme.apply("light");
        }

        window.mangaHubReader = {
            getSettings: function () {
                var prefix = "mangahub_reader_settings=";
                var cookie = document.cookie.split(";").map(function (value) { return value.trim(); })
                    .find(function (value) { return value.indexOf(prefix) === 0; });

                if (!cookie) {
                    return null;
                }

                try {
                    return JSON.parse(decodeURIComponent(cookie.substring(prefix.length)));
                } catch {
                    return null;
                }
            },
            setSettings: function (settings) {
                var value = encodeURIComponent(JSON.stringify(settings || {}));
                document.cookie = "mangahub_reader_settings=" + value + "; max-age=31536000; path=/; samesite=lax";
            },
            fitPage: function (frame, image) {
                if (!frame || !image || !frame.parentElement) {
                    return;
                }

                if (frame.mangaHubResizeObserver) {
                    frame.mangaHubResizeObserver.disconnect();
                }

                var reader = frame.parentElement;
                var fit = function () {
                    if (!image.naturalWidth || !image.naturalHeight) {
                        return;
                    }

                    var readerStyle = window.getComputedStyle(reader);
                    var horizontalPadding = parseFloat(readerStyle.paddingLeft) + parseFloat(readerStyle.paddingRight);
                    var verticalPadding = parseFloat(readerStyle.paddingTop) + parseFloat(readerStyle.paddingBottom);
                    var availableWidth = Math.max(1, reader.clientWidth - horizontalPadding);
                    var availableHeight = Math.max(1, reader.clientHeight - verticalPadding);
                    var ratio = image.naturalWidth / image.naturalHeight;
                    var width = availableWidth;
                    var height = width / ratio;

                    if (height > availableHeight) {
                        height = availableHeight;
                        width = height * ratio;
                    }

                    frame.style.width = Math.floor(width) + "px";
                    frame.style.height = Math.floor(height) + "px";
                    frame.style.aspectRatio = image.naturalWidth + " / " + image.naturalHeight;
                };

                frame.mangaHubResizeObserver = new ResizeObserver(fit);
                frame.mangaHubResizeObserver.observe(reader);
                fit();
            },
            preloadPages: async function (urls) {
                if (!Array.isArray(urls)) {
                    return;
                }

                var preloaded = window.mangaHubReader.preloadedPages || new Map();
                window.mangaHubReader.preloadedPages = preloaded;

                var preloadTasks = urls.filter(function (url) { return !!url; }).map(function (url) {
                    var existing = preloaded.get(url);
                    if (existing) {
                        return existing.ready;
                    }

                    var image = new Image();
                    image.decoding = "async";
                    var ready = new Promise(function (resolve) {
                        image.onload = resolve;
                        image.onerror = resolve;
                    }).then(function () {
                        return image.decode().catch(function () { });
                    });

                    preloaded.set(url, { image: image, ready: ready });
                    image.src = url;
                    return ready;
                });

                // Keep memory use bounded while retaining a short read-ahead window.
                while (preloaded.size > 12) {
                    preloaded.delete(preloaded.keys().next().value);
                }

                await Promise.all(preloadTasks);
            },
            disposePage: function (frame) {
                if (frame && frame.mangaHubResizeObserver) {
                    frame.mangaHubResizeObserver.disconnect();
                    delete frame.mangaHubResizeObserver;
                }
                if (frame && frame.mangaHubVerticalObserver) {
                    frame.mangaHubVerticalObserver.disconnect();
                    delete frame.mangaHubVerticalObserver;
                }
                if (frame && frame.mangaHubVerticalPageObserver) {
                    frame.mangaHubVerticalPageObserver.disconnect();
                    delete frame.mangaHubVerticalPageObserver;
                }
            },
            observeVerticalEnd: function (frame, endMarker, dotNetReference) {
                if (!frame || !endMarker || !frame.parentElement || !dotNetReference) {
                    return;
                }

                if (frame.mangaHubVerticalObserver) {
                    frame.mangaHubVerticalObserver.disconnect();
                }

                frame.mangaHubVerticalObserver = new IntersectionObserver(function (entries) {
                    if (entries.some(function (entry) { return entry.isIntersecting; })) {
                        dotNetReference.invokeMethodAsync("MarkVerticalChapterRead");
                    }
                }, {
                    root: frame.parentElement,
                    threshold: 0.5
                });
                frame.mangaHubVerticalObserver.observe(endMarker);

                frame.mangaHubVerticalPageObserver = new IntersectionObserver(function (entries) {
                    entries.forEach(function (entry) {
                        if (entry.isIntersecting) {
                            dotNetReference.invokeMethodAsync("SetVerticalPage", Number(entry.target.dataset.readerPage));
                        }
                    });
                }, {
                    root: frame.parentElement,
                    threshold: 0.55
                });
                frame.querySelectorAll("[data-reader-page]").forEach(function (image) {
                    frame.mangaHubVerticalPageObserver.observe(image);
                });
            },
            scrollVerticalPage: function (frame, pageIndex) {
                if (!frame) {
                    return;
                }

                var image = frame.querySelector('[data-reader-page="' + pageIndex + '"]');
                if (image) {
                    image.scrollIntoView({ behavior: "smooth", block: "start" });
                }
            }
        };
    </script>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/book.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#6d3bb6" />
    <link rel="stylesheet" href="css/app.css?v=171" />
    <link href="MangaHub.Web.styles.css?v=171" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">ðŸ—™</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("service-worker.js");
            });
        }
    </script>
</body>

</html>
